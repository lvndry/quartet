name: Release Binaries

on:
  # Rebuild / attach for an already-published release (tag already exists).
  release:
    types:
      - published
  # Normal path: pick a semver bump; the workflow creates the tag and release.
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump from the latest tag (first release starts at v0.0.0)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    name: Resolve version
    # A workflow_dispatch run creates the release with GITHUB_TOKEN, which fires a second
    # `release: published` run. That duplicate would rebuild everything; skip it.
    if: github.event_name != 'release' || github.event.release.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so the latest tag is visible for bumping.
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ github.event.inputs.bump }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
            echo "Using published release tag $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Latest semver tag, or v0.0.0 when this repo has never been tagged.
          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          ver="${latest#v}"
          major="${ver%%.*}"
          rest="${ver#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          patch="${patch%%[^0-9]*}"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *)
              echo "::error::Unknown bump '$BUMP'"
              exit 1
              ;;
          esac

          tag="v${major}.${minor}.${patch}"
          echo "Bumping $latest → $tag ($BUMP) at $SHA"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          # Create the GitHub release (and tag) on this commit. Same run continues to build
          # and upload; we do not rely on the `release: published` trigger for this path
          # because that would start a second workflow.
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --target "$SHA"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS binaries are built on macOS so they come out ad-hoc signed. An unsigned
          # Mach-O is killed on sight by arm64 macOS, and cross-compiling from Linux produces
          # exactly that.
          - name: darwin-arm64
            runner: macos-latest
            targets: bun-darwin-arm64
          - name: darwin-x64
            runner: macos-latest
            targets: bun-darwin-x64
          - name: linux
            runner: ubuntu-latest
            targets: bun-linux-x64 bun-linux-arm64 bun-linux-x64-musl bun-linux-arm64-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Once for the whole matrix leg: the app is the same bytes everywhere, and the compile
      # steps below reuse the table generated from this build.
      - name: Build the app
        run: bun run app:build

      # The tag is the version. $TAG_NAME is in the environment for every job here, and
      # scripts/version.ts reads it — passed explicitly anyway, so the command says what it
      # is building rather than depending on what happens to be exported.
      - name: Compile binaries
        run: |
          for target in ${{ matrix.targets }}; do
            bun run scripts/build.ts --skip-app-build --version "$TAG_NAME" --target "$target"
          done

      - name: Sign macOS binaries
        if: runner.os == 'macOS'
        run: |
          for binary in deploy/binaries/*; do
            codesign --force --sign - "$binary"
            codesign --verify --verbose "$binary"
          done

      # Only where the binary can actually run. Cross-compiled targets are checked by the
      # matching native leg, or by CI on the pull request that produced this tag.
      - name: Smoke test the native binary
        if: matrix.name == 'darwin-arm64' || matrix.name == 'linux'
        run: |
          arch="$([ "$(uname -m)" = "x86_64" ] && echo x64 || echo arm64)"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          bun run smoke:binary "deploy/binaries/quartet-$os-$arch"

      - name: Compress binaries
        run: gzip -9 deploy/binaries/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: deploy/binaries/*.gz
          retention-days: 1

  publish:
    name: Attach binaries to the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      # install.sh refuses to install anything it cannot check against this file, so a release
      # without it is a broken release rather than an unverifiable one.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum *.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp scripts/install.sh artifacts/install.sh
          gh release upload "$TAG_NAME" artifacts/* --clobber

  publish-npm:
    name: Publish npm packages
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm 11.5.1 or later
        run: npm install -g npm@^11.5.1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Unpack binaries
        run: |
          mkdir -p deploy/binaries
          cp artifacts/*.gz deploy/binaries/
          gunzip deploy/binaries/*.gz
          chmod +x deploy/binaries/*

      # Every quartet-ai-<platform> package gets its binary and version stamped here, and
      # quartet-ai gets its version, its optionalDependencies and the docs its `files` list
      # references. This reuses the macOS-signed binaries the build job produced rather than
      # recompiling: an ad-hoc signature only applies on the OS that made it.
      - name: Stage npm packages
        run: bun run scripts/build.ts --npm-packages-from-dir deploy/binaries --version "$TAG_NAME"

      # Must publish before quartet-ai, whose optionalDependencies pin this exact version.
      - name: Publish platform packages
        run: |
          failed=()
          for dir in deploy/npm/quartet-ai-*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            version="$(node -p "require('./${dir}package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            echo "Publishing $name..."
            (cd "$dir" && npm publish) || failed+=("$name")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed to publish: ${failed[*]}"
            exit 1
          fi

      - name: Publish quartet-ai
        working-directory: deploy/npm/quartet-ai
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
            exit 0
          fi
          npm publish
