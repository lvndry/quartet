name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, tests, smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The loop, against real hub and bridge processes and stand-in daemons.
      - name: Smoke
        run: bun run smoke

  binary:
    name: The binary works on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Linux
            runner: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile for this machine
        run: bun run build:binary

      # Everything that breaks in a binary breaks at the seam between the code and the files
      # it expects beside it, which every other job here passes without noticing. Run on both
      # platforms because the two do not fail the same way: macOS kills an unsigned binary,
      # Linux does not.
      - name: Smoke the binary
        run: bun run smoke:binary
